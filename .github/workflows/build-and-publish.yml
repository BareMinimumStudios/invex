name: "Build and Publish"

on:
  push:
    tags:
      - v**
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        loader: [fabric]
        minecraft_version: [1.20.1, 1.21.1]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21
          cache: gradle

      - name: Build
        run: ./gradlew build

      - name: Get mod metadata
        id: mod-meta
        run: |
          version=$(grep "version =" build.gradle.kts | cut -d'=' -f2 | cut -d'"' -f2 | tr -d '\n')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Publish
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: g1ph7wAM
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          curseforge-id: 1584857
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}

          files: build/libs/*-(${{ matrix.minecraft_version }}).jar

          version: ${{ steps.mod-meta.outputs.version }}

          loaders: ${{ matrix.loader }}
          game-versions: ${{ matrix.minecraft_version }}
